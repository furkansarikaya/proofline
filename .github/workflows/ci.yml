name: ci
# A76: pull requests run the Linux checks only, split into parallel jobs and shards. A164 changes A76's matrix:
# pushes to main are Linux only too; macOS (static, fixtures), visual-browser and the benchmark report
# run only on the nightly schedule and manual runs. A pull request that changes only plain documentation skips the heavy test
# jobs (tests/ci/classify.mjs) but still runs the strict no-shell-logic check and the sync checks. The `checks` job always reports.
# Node migration (docs/adr/0001-node-control-plane.md): `node-tests` (the Node tests of tests/core, tests/ci, tests/enforcement and tests/invariants-node on Node 22.13.0 and the active LTS) and `types` (pinned checker, jsconfig.json) are gates.
# The temporary pull request shortcut (A205) and the legacy self-test shards are gone (A246, issue #176): a pull request runs what a push runs on Linux,
# including the fixtures job and the skill tests; only a documentation-only change skips the heavy jobs.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  # one group per pull request; every other event gets its own group so queued main runs are never displaced
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tests/ci/ci-steps.mjs classify

  static:
    needs: [changes]
    strategy:
      fail-fast: false
      matrix:
        # macOS runs on the nightly schedule and manual runs only (A164); pushes and pull requests run Linux only.
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: role sources conform
        run: node tests/generator/role-conformance.mjs roles

      - name: generated files in sync
        run: node adapters/generate.mjs --check

      - name: skills reference in sync
        run: node docs/reference/generate-skills.mjs --check

      - name: shared sections in sync
        run: node tests/shared/check-shared.mjs

      - name: static rules (shortcut labels, README size)
        run: node tests/shared/check-static.mjs

      # A125: front matter, YAML/TOML and Markdown links; runs for documentation-only pull requests too
      - name: front matter and link check
        run: node --test tests/skills/frontmatter.test.mjs
      # ADR 0001 section 9 / A187: no ecosystem branching in shared Node code; fails when ecosystems.json is missing
      - name: ecosystem branching (Node)
        run: node tests/ci/ecosystem-branching.mjs

      # ADR 0001 section 9 (A251): the strict no-shell-logic check: shell files are the four launchers, byte-equal to tests/ci/launcher-templates.txt; hook strings equal their templates; every run: step is one command line; no shell or awk started from Node outside core/proc.mjs.
      - name: no shell logic (strict)
        run: node tests/ci/no-shell-logic.mjs

      - name: generator tests
        if: needs.changes.outputs.code == 'true'
        run: node --test "tests/generator/*.test.mjs"

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 22

      - name: skill tests
        if: needs.changes.outputs.code == 'true'
        run: node tests/ci/ci-steps.mjs skill-tests

  fixtures:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # macOS runs on the nightly schedule and manual runs only (A164); pushes and pull requests run Linux only.
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: fixtures
        run: node tests/fixtures/check-fixtures.mjs
      # A90: the full benchmark report (fixture selfchecks and skill tests) is nightly and manual only (A164), not a gate.
      - name: benchmark report
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node tests/benchmark/benchmark.mjs --run-validators --out "$RUNNER_TEMP/benchmark"
  # A82/A110: the visual-proof fixture measured in a real headless browser on the runner image's own browser.
  # Not a pull-request or push job (those run the browser-less validator tests in tests/skills); nightly
  # and manual runs only (A164). A runner without a Chromium-family browser prints UNSUPPORTED and passes: that is the
  # accepted result there, never a measured pass.
  visual-browser:
    needs: [changes]
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # --no-sandbox: the Linux runner kernel restricts unprivileged user namespaces
      # (kernel.apparmor_restrict_unprivileged_userns=1), which the browser sandbox needs.
      - name: visual-proof browser measurement
        run: node fixtures/visual-proof/browser-check.mjs --no-sandbox

  # A188, stage 3: the Node hook on Windows. It runs the hook tests (node:test) and the hook benchmark in its Node form (processes and time per event, the
  # table goes to the job summary). It replaces the Git Bash timing job for the hook: the hook no longer needs an `sh` of its own. Nightly and manual runs
  # only (A164, A204). Since A250 it is a gate of those runs (no continue-on-error: a red Windows test fails the nightly workflow); it stays out of `checks`, which pull requests wait for, because it does not run on a pull request.
  # The benchmark builds its fixture with the Node harness (tests/bench/hook-procs.mjs, the PATH shim files are small sh scripts that Git Bash runs); no step needs bash as its shell, so the job runs the runner's default shell.
  hook-windows:
    needs: [changes]
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: hook tests (node:test)
        run: node --test "tests/hook/*.test.mjs"
      - name: hook processes and time per event (Node form, table in the job summary)
        run: node tests/ci/ci-steps.mjs windows-timing

  # A251, stage 15: a MEASUREMENT of the core's Node tests and the Node Core-invariant suite on Windows. It is not a gate and not a claim: on the first run (A251) most core tests and 7 of the 8
  # invariant tests failed on windows-latest, so the README does not say they pass there. Manual runs only (workflow_dispatch), `continue-on-error`, so the nightly workflow does not go red for known work;
  # when a run of it is all green, remove `continue-on-error`, widen the condition to the nightly schedule and let README.md claim Windows.
  windows-core-probe:
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.code == 'true'
    name: windows-core-probe (${{ matrix.suite }})
    continue-on-error: true
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: ['core 1/4', 'core 2/4', 'core 3/4', 'core 4/4', 'invariants']
        include:
          - suite: core 1/4
            args: --test-shard=1/4 "tests/core/*.test.mjs"
          - suite: core 2/4
            args: --test-shard=2/4 "tests/core/*.test.mjs"
          - suite: core 3/4
            args: --test-shard=3/4 "tests/core/*.test.mjs"
          - suite: core 4/4
            args: --test-shard=4/4 "tests/core/*.test.mjs"
          - suite: invariants
            args: '"tests/invariants-node/*.test.mjs"'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: node:test (this part)
        run: node --test ${{ matrix.args }}

  # The Node tests of this repository's CI and enforcement code, on the minimum runtime (22.13.0) and the current active LTS. Never skipped.
  node-tests:
    timeout-minutes: 40
    name: node-tests (${{ matrix.node }}, ${{ matrix.leg.name }})
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', 'lts/*']
        # One leg per group of test FILES (the slow ones split further by test name: `name` runs the tests whose name matches the pattern, `skip` runs
        # all the others, so a name list and its complement partition a file). Before this one job ran every file serially (68 and 34 minutes). Every leg
        # runs on both Node versions; the `ci-bench-enforcement` leg names globs, so a new test file under tests/ci or tests/enforcement joins it by itself; tests/ci/node-tests-legs.test.mjs checks that every test file and every test of a split file is in exactly one leg.
        leg:
          - name: verify
            mode: files
            pattern: 'none'
            files: tests/core/verify-fixes.test.mjs
          - name: core-rest
            mode: files
            pattern: 'none'
            files: tests/core/approval-grammar.test.mjs tests/core/approve-tty.test.mjs tests/core/argv0.test.mjs tests/core/base.test.mjs tests/core/unsupported.test.mjs tests/core/budget.test.mjs tests/core/capture.test.mjs tests/core/cli.test.mjs tests/core/config-check.test.mjs tests/core/config-check-grep.test.mjs tests/core/config.test.mjs tests/core/entry.test.mjs tests/core/exec-policy.test.mjs tests/core/fingerprint.test.mjs tests/core/githooks.test.mjs tests/core/golden.test.mjs tests/core/inflight-parts.test.mjs tests/core/lock.test.mjs tests/core/preamble.test.mjs tests/core/proc-epipe.test.mjs tests/core/records.test.mjs tests/core/signals.test.mjs tests/core/table.test.mjs tests/core/timeouts.test.mjs tests/core/tools.test.mjs tests/core/tree.test.mjs tests/core/windows-patterns.test.mjs tests/core/grep-failclosed.test.mjs
          - name: legacy-approvals
            mode: files
            pattern: 'none'
            files: tests/core/answer-user.test.mjs tests/core/legacy-approval-grammar.test.mjs tests/core/legacy-approval-multi.test.mjs tests/core/legacy-approvals.test.mjs tests/core/legacy-questions.test.mjs tests/core/legacy-waivers.test.mjs
          - name: port-rig-a
            mode: files
            pattern: 'none'
            files: tests/core/port-t3-rig-stage1.test.mjs tests/core/port-t3-rig-stage2-1.test.mjs tests/core/port-t3-rig-stage2-2.test.mjs tests/core/port-t3-rig-stage2-3.test.mjs
          - name: port-rig-b
