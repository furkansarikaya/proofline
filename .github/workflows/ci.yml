          - name: ci-bench-enforcement
            mode: files
            pattern: 'none'
            files: tests/ci/*.test.mjs tests/enforcement/guards.test.mjs tests/enforcement/wiring.test.mjs
          - name: harness
            mode: files
            pattern: 'none'
            files: tests/lib/*.test.mjs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: tests of this leg (files)
        if: matrix.leg.mode == 'files'
        run: node --test ${{ matrix.leg.files }}
      # nightly and manual runs only: the whole set in one process as before, the safety net behind the legs (on a pull request this leg does nothing)
      - name: every test file in one process (nightly and manual runs)
        if: matrix.leg.mode == 'full' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: node --test "tests/ci/*.test.mjs" "tests/enforcement/*.test.mjs" "tests/core/*.test.mjs" "tests/e2e/*.test.mjs" "tests/real-session/*.test.mjs" "tests/invariants-node/*.test.mjs" "tests/lib/*.test.mjs"
      - name: tests of this leg (by test name)
        if: matrix.leg.mode == 'name'
        env:
          PATTERN: ${{ matrix.leg.pattern }}
        run: node --test "--test-name-pattern=$PATTERN" ${{ matrix.leg.files }}
      - name: tests of this leg (all but the names of another leg)
        if: matrix.leg.mode == 'skip'
        env:
          PATTERN: ${{ matrix.leg.pattern }}
        run: node --test "--test-skip-pattern=$PATTERN" ${{ matrix.leg.files }}

  # The shipped Node hook (stage 3) is a pull request gate: its own tests and the guard tests run AGAINST
  # adapters/claude/hooks/proofline-hook.mjs (the enforcement suites, ported to Node in A239, run as `node-tests` legs under tests/enforcement/ against the same hook). The
  # wall time is the slowest leg (the hook tests, guards, wiring and process budgets, about 6 minutes). The Node tests run on Node 22.13.0 and the active LTS. Never skipped.
  hook-node:
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: node-tests
            node: '22.13.0'
          - suite: node-tests
            node: 'lts/*'
    runs-on: ubuntu-latest
    env:
      HOOK_UNDER_TEST: ${{ github.workspace }}/adapters/claude/hooks/proofline-hook.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: hook tests (node:test)
        if: matrix.suite == 'node-tests'
        run: node --test "tests/hook/*.test.mjs"
      - name: process and output budgets of the execution policy, the runtime detection and the known-issue commands
        if: matrix.suite == 'node-tests'
        run: node --test tests/bench/exec-budgets.test.mjs
      - name: process and output budgets of the night-mode read commands (batch-next, batch-status, batch-answers)
        if: matrix.suite == 'node-tests'
        run: node --test tests/bench/batch-budgets.test.mjs
      - name: process budgets of the execution decision and the dispatcher
        if: matrix.suite == 'node-tests'
        run: node --test tests/bench/dispatch-budgets.test.mjs
      - name: process budgets of the helper commands (build-record, friction, calibrate, lessons, rules)
        if: matrix.suite == 'node-tests'
        run: node --test tests/bench/helper-budgets.test.mjs
      - name: guard tests against the Node hook
        if: matrix.suite == 'node-tests'
        env:
          GUARDS_HOOK: ${{ github.workspace }}/adapters/claude/hooks/proofline-hook.mjs
        run: node --test tests/enforcement/guards.test.mjs
      - name: wiring tests
        if: matrix.suite == 'node-tests'
        run: node --test tests/enforcement/wiring.test.mjs

  # Type check of the Node code (jsconfig.json). The checker and the Node type definitions are fetched in this job only, at pinned exact versions;
  # nothing is added to a package.json and nothing is shipped. Never skipped.
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: fetch the pinned checker (typescript 6.0.3, @types/node 22.20.4)
        run: npm install --prefix "$RUNNER_TEMP/tc" --no-save --no-package-lock --ignore-scripts typescript@6.0.3 @types/node@22.20.4
      - name: type check
        run: node "$RUNNER_TEMP/tc/node_modules/typescript/bin/tsc" -p jsconfig.json --typeRoots "$RUNNER_TEMP/tc/node_modules/@types"

  # Core invariants (CONTRIBUTING.md): the invariant tests run on EVERY pull request, documentation-only ones included, and on every push
  # to main. A pull request that changes tests/invariants-node/ must carry an `Invariant-test-change:` line in its description. The
  # description is read live (a re-run sees an edited description), falling back to the event payload.
  invariants:
    name: invariants (${{ matrix.scenario }})
    strategy:
      fail-fast: false
      matrix:
        # One leg per core-invariant test of tests/invariants-node/ (the leg names are the scenario names of the former shell suite, so a required-check list keeps
        # its names; `pattern` selects the test by name, `^invN:` never matches `^invNb:`). The first leg also runs the checks that are not scenarios (the
        # change-reason scripts and the context budget).
        include:
          - scenario: sc_inv1_code_done_needs_gates
            file: tests/invariants-node/rules-1-2.test.mjs
            pattern: '^inv1:'
          - scenario: sc_inv2_never_waivable
            file: tests/invariants-node/rules-1-2.test.mjs
            pattern: '^inv2a:'
          - scenario: sc_inv2_run_on_change
            file: tests/invariants-node/rule-2b.test.mjs
            pattern: '^inv2b:'
          - scenario: sc_inv3_user_message_only
            file: tests/invariants-node/rule-3.test.mjs
            pattern: '^inv3:'
          - scenario: sc_inv4_evidence_reproduced
            file: tests/invariants-node/rule-4.test.mjs
            pattern: '^inv4:'
          - scenario: sc_inv4_green_needs_change
            file: tests/invariants-node/rule-4.test.mjs
            pattern: '^inv4b:'
          - scenario: sc_inv5_no_self_review
            file: tests/invariants-node/rules-5-6.test.mjs
            pattern: '^inv5:'
          - scenario: sc_inv6_safe_side
            file: tests/invariants-node/rules-5-6.test.mjs
            pattern: '^inv6:'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: invariant tests (this scenario)
        env:
          PATTERN: ${{ matrix.pattern }}
        run: node --test "--test-name-pattern=$PATTERN" ${{ matrix.file }}
      - name: context budget, measured by the Node core (A202, A230)
        if: matrix.scenario == 'sc_inv1_code_done_needs_gates'
        run: node --test tests/core/contextsize.test.mjs
      - name: invariant tests changed only with a reason
        if: github.event_name == 'pull_request' && matrix.scenario == 'sc_inv1_code_done_needs_gates'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tests/ci/change-reason.mjs invariants --base ${{ github.event.pull_request.base.sha }} --head ${{ github.sha }} --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }}
      - name: launchers changed only with a reason (A251)
        if: github.event_name == 'pull_request' && matrix.scenario == 'sc_inv1_code_done_needs_gates'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tests/ci/change-reason.mjs launchers --base ${{ github.event.pull_request.base.sha }} --head ${{ github.sha }} --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }}
      - name: context budget changed only with a reason (A202)
        if: github.event_name == 'pull_request' && matrix.scenario == 'sc_inv1_code_done_needs_gates'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tests/ci/change-reason.mjs context-budget --base ${{ github.event.pull_request.base.sha }} --head ${{ github.sha }} --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }}

  # One stable check name for branch protection: skipped jobs (documentation-only pull request) count as
  # passed, a failed or cancelled job fails it.
  checks:
    if: always()
    needs: [changes, static, fixtures, visual-browser, invariants, node-tests, hook-node, types]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: gate (a failed or cancelled job fails; skipped jobs pass)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node tests/ci/ci-steps.mjs gate
