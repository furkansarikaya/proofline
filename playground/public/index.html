<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading List</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
    form, .toolbar, .pager { display: flex; gap: 0.5rem; align-items: center; margin: 1rem 0; flex-wrap: wrap; }
    ul { list-style: none; padding: 0; }
    li { border-bottom: 1px solid #ddd; padding: 0.75rem 0; }
    .meta, .legacy { color: #666; font-size: 0.9rem; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Reading List</h1>
  <p class="tagline">Your personal libary of books to read, reading and finished.</p>

  <form id="add-form">
    <input name="title" placeholder="Title" required maxlength="200" aria-label="Title">
    <input name="author" placeholder="Author" required maxlength="200" aria-label="Author">
    <button type="submit">Add book</button>
  </form>
  <p id="error" class="error" role="alert"></p>

  <div class="toolbar">
    <label for="status-filter">Show</label>
    <select id="status-filter">
      <option value="">All books</option>
      <option value="want_to_read">Want to read</option>
      <option value="reading">Reading</option>
      <option value="finished">Finished</option>
    </select>
  </div>

  <ul id="books"></ul>

  <div class="pager">
    <button id="prev" type="button">Previous</button>
    <span id="page-info"></span>
    <button id="next" type="button">Next</button>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
