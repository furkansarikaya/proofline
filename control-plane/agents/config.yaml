# proofline control-plane configuration (installed as .agents/config.yaml).
# Indented YAML of scalars; lists are space-separated (approval.phrases is comma-separated because a
# phrase may contain spaces); the one exception is commands.build|test|lint, which may be a block list of
# commands (A173). `agent.sh config-get <dotted.key>` reads a value (the items, one per line, for a list),
# `agent.sh config-check` validates the file. Semantics: .agents/WORKFLOW.md and .agents/GATES.md.
proofline_version: 0.0.36
# The canonical integration branch (detected by init). No task implements on it directly.
canonical_branch: main
# orchestrated: the lead never writes product code (D2). standalone: the lead implements (protocol tier).
default_topology: orchestrated
# Model profile (D5): max | balanced | economy. A run's execution.profile overrides it.
profile: balanced
runtime:
  lead: claude
  worker: claude
  reviewers: claude
  # Optional per-role override, for example `security_reviewer: claude`.
  roles:
# Specialist failover (D7): auto | ask | off.
failover: auto
# supervised: freeze needs a plan approval. autonomous: no stop before CODE_DONE (D3).
autonomy:
  TRIVIAL: autonomous
  STANDARD: autonomous
  COMPLEX: supervised
  CRITICAL: supervised
review:
  max_fix_rounds: 2
  small_max_files: 2
  small_max_lines: 30
  # A change touching one of these globs is never tier small. The files of the languages (manifests, locks, package-source
  # settings, build-changing files, CI workflows, Dockerfile and compose files) come from .agents/ecosystems.json and are added
  # at read time (A173); list here only what is specific to this project, plus the kinds that file does not describe.
  risky_paths: "**/migrations/** **/migration/** **/*migration*.* **/schema.* **/auth/** **/*auth*.* **/security/** **/*security*.* **/payment*/** **/*payment*.* **/billing/** **/crypto/** **/*crypto*.* **/secrets/** **/deploy/** **/*deploy*.* **/k8s/** **/helm/** **/infra/** **/terraform/** *.tf *.tfvars mix.exs mix.lock CMakeLists.txt conanfile.txt vcpkg.json"
  # Markdown that is code: never tier docs.
  code_like_markdown: ".agents/** skills/** roles/** adapters/** .claude/** .codex/** AGENTS.md CLAUDE.md **/SKILL.md **/*.prompt.md"
  # none | task: `task` writes a follow-up task per waiver through the task adapter.
  waiver_followup: none
git:
  branch_prefix: proofline/
  commit_format: conventional
  # Empty by default (D34): the team decides.
  protected_branches:
  push_requires_approval: true
  # Hosting platform of the remote (A186), for a private host proofline cannot recognize by name: github | gitlab | azure |
  # bitbucket | other. Precedence: this key, then the PROOFLINE_PLATFORM environment variable, then the origin URL (github.com,
  # gitlab.com, dev.azure.com, bitbucket.org). `proofline doctor` shows the platform and which of the three decided.
  platform:
  # Bare host name of the origin remote that `platform` applies to, for example gitlab.company.com, github.company.com or an
  # Azure DevOps Server host. It must EQUAL the host of the origin URL (never a prefix, suffix or part of it), so a look-alike
  # host never gets the platform; empty means `platform` applies to whatever the origin is. GitHub Enterprise uses GH_HOST and
  # self-hosted GitLab GITLAB_HOST (set for the tool from this host); Azure DevOps Server uses the collection URL of the origin.
  platform_host:
  # Forbidden commit identities (glob or ERE, case-insensitive), for example *@example-corp.com
  forbidden_identities:
approval:
  phrases: approve, approved, yes, ok, okay, go ahead, lgtm, commit it, push it, onay, onaylıyorum, onayliyorum, onaylandı, onaylandi, onayladım, onayladim, evet, tamam, olur
commands:
  # Optional: installs dependencies in the build record's export directory (agent.sh build-record); without it
  # the dependency folders named by worktree_deps in ecosystems.json are copied into the export.
  install:
  # build, test and lint take one command (`build: dotnet build App.slnx`) or several, one `- ` line each, for a project with more
  # than one stack (A173). agent.sh build-record and the verify gate run every one and report the one that broke on its own:
  #   build:
  #     - dotnet build App.slnx
  #     - npm --prefix web run build
  # Write one form per key; `agent.sh config-check` rejects both at once, an empty item and a duplicate.
  build:
  test:
  lint:
  # The project's own secret scanner, if any; the built-in pattern scan otherwise.
  secret_scan:
tasks:
  adapter: markdown
  dir: .agents/tasks
design_docs:
  design: docs/design/DESIGN.md
  # One document per UI surface instead of one path: write design as a mapping (agent.sh design-surface <PATH> names the
  # documents that apply to a file; two surfaces matching one file is an error, no match means the shared document only).
  # design:
  #   shared: docs/design/BASE.md
  #   surfaces:
  #     site:
  #       doc: docs/design/SITE.md
  #       paths: apps/web/** apps/landing/**   (one **/ per glob at most; no \ or |)
  #       mode: persuade
  #     app:
  #       doc: docs/design/APP.md
  #       paths: apps/dashboard/**
  #       mode: operate
  architecture: docs/design/ARCHITECTURE.md
  data_model: docs/design/DATA_MODEL.md
  api: docs/design/API.md
  adr_dir: docs/adr
# Run worktrees (A185). copy_files: space-separated globs (a pattern without / matches at any depth) of untracked local files a new
# worktree gets a copy of, so the task can run the project (default `.env*`; `none` copies nothing). Only a file git IGNORES is copied, and a
# copied file can never be committed (the pre-commit hook refuses it); the secret scan still sees it. Dependency folders are prepared from
# worktree_deps in ecosystems.json, never linked to the main tree.
worktree:
  copy_files: ".env*"
# Evidence archive (A200). `cleanup` and `worktree-remove` put a compressed copy of a run's records under .agents/local/archive/<ID>/ (git-ignored)
# before they delete them; the newest `keep` runs are kept, older ones removed. 0 turns the archive off.
archive:
  keep: 10
# Build record (A148). env_files: space-separated project-relative names of SECRET-FREE test env files (for example `.env.test`) that may
# enter the clean copy of the build record, which otherwise holds no git-ignored file and so no .env*. Default: none. Each listed file is
# scanned for secrets first; one visible secret makes `agent.sh build-record <ID> run` refuse, naming the file and the line, never the value.
verification:
  env_files:
  # Documentation paths (A197): a scope path of this kind (also design_docs and knowledge_scope_root) without tdd_exemption gets a freeze warning. Space-separated;
  # a directory entry ends in /, `*.ext` matches a suffix, any other entry an exact path.
  doc_paths: docs/ *.md *.mdx *.rst *.adoc
local_state: on
metrics: on
# Writing profile (A138) for the docs-writer skill and any skill that writes prose. profile: auto = English text
# follows the simplified-technical-English rules (ste), Turkish text the plain-language rules (plain); ste or plain
# forces one. strictness: relaxed reports a length finding as a warning, strict fails on it.
writing:
  profile: auto
  strictness: relaxed
# Product documents (product-spec skill). dir: project-relative folder of <slug>/PRD.md and <slug>/REVIEW.md.
# vague_words: extra unmeasurable words the PRD check flags in acceptance criteria, comma-separated (a phrase may
# contain spaces), added to the built-in English and Turkish list. stale_days: age in days after which an observed
# competitor cell counts as stale (positive integer).
product:
  dir: docs/product
  vague_words:
  stale_days: 90
test_trust:
  repeat: 5
  mutation_budget: 20
  slow_ratio: 3
# performance-proof (A87): regression threshold on the median in percent, noise threshold (relative MAD) in
# percent, minimum runs per side (at least 5). A relative budget stated in PLAN.md wins over these values.
performance:
  regression_pct: 10
  noise_pct: 5
  min_runs: 10
budgets:
  max_advisor_calls: 3
  max_escalations: 2
  max_parallel_reviewers: 5

# Database guard (A40; enforced by the runtime hook and checked by agent.sh). No agent reads, copies, queries or
# writes a database file, runs a SQL client, or runs a migration/seed command; the only database an agent may
# meet is a test suite's own throwaway database (under $TMPDIR, outside the project, or in memory). Empty =
# the built-in language-independent default. Lists are space-separated except migrate_commands (comma-separated
# extended regular expressions, matched against each command word and its arguments).
database:
  # Database files, by basename glob (or project-relative glob when it contains /).
  paths: "*.db *.sqlite *.sqlite3 *.db3 *.s3db *.sdb *.mdb *.accdb *.ldb *.mv.db *.duckdb *.rdb *.db-wal *.db-shm *.db-journal *.sqlite-wal *.sqlite-shm *.sqlite-journal"
  # SQL/database command-line clients. sqlite-family clients are allowed only against :memory: or a scratch file.
  clients: "sqlite3 sqlite duckdb litecli psql pgcli pg_dump pg_dumpall pg_restore createdb dropdb mysql mysqldump mysqlsh mycli mariadb mongosh mongo mongodump mongorestore redis-cli sqlcmd sqlplus sqlite-utils usql clickhouse-client cockroach cqlsh"
  # Migration, seed and schema-push commands of the common ecosystems; add the project's own.
  migrate_commands: "(npm|pnpm|yarn|bun)( run)? (migrate|migration|migrations|seed|seeds|db[:-])[A-Za-z0-9:_-]*( |$), (^| )(npx|pnpm exec|bunx|yarn dlx) (prisma|drizzle-kit|knex|sequelize|sequelize-cli|typeorm|mikro-orm|db-migrate|node-pg-migrate)( |$), (^| )prisma (migrate|db) , (^| )drizzle-kit (push|migrate|drop), (^| )(knex|sequelize|sequelize-cli|typeorm|mikro-orm|umzug|db-migrate|node-pg-migrate) .*(migrat|seed|db:|schema:), (^| )alembic (upgrade|downgrade|stamp), (^| )flask( .*)? db (upgrade|downgrade|stamp|migrate), (manage\.py|django-admin)( .*)? (migrate|flush|sqlflush|loaddata|dbshell), (^| )(rails|rake|bin/rails)( .*)? db:, (^| )artisan (migrate|db:), (^| )(flyway|liquibase|dbmate|goose|atlas|sqitch|tern|phinx|diesel|sqlx|sea-orm-cli)( .*)? (migrate|up|down|apply|deploy|update|run|push|revert|redo|reset|drop|seed), (^| )dotnet ef (database|migrations) , (^| )mix ecto\.(migrate|rollback|reset|drop|setup|load), (^| )migrate( .*)? (up|down|goto|drop|force), (^| )db(:| )(seed|migrate|reset|drop|push|setup)"

# Security extension (A88), read by the SECURITY `dependencies` focus. `licenses.allow` / `licenses.deny` are
# space-separated SPDX ids checked against the license a lockfile records for a new or changed dependency; both
# empty (the default) means the license check is reported as "not configured", never as passed. `audit_command` is
# the project's own audit command, if it has one; nothing is installed and the focus runs only tools that exist.
# A non-empty `security.*` value is bound by the freeze (with the `risk:` block): editing it mid-run is refused.
security:
  licenses:
    allow:
    deny:
  audit_command:

# Input validation at entry points (A162). Every key but `code_patterns` is an alternation of words (an extended
# regular expression, case-insensitive) that agent.sh and the plan-contract and qa-plan validators read as WHOLE words
# (a `.` or `-` inside an identifier such as `schema.graphql` is no boundary). A `## Contracts` bullet of PLAN.md is
# MANDATORY (the freeze then needs one `## Validation` line for the entry point and the QA plan one `[invalid-input]`
# scenario) when it declares an entry point (`entry_words`), is not the entry point's own removal, does not say it is
# unchanged or documented (`entry_skip`), and marks new or changed input: an `entry_input` word, or an `entry_new`
# word with no `entry_output` word. A bullet that only mentions `entry_candidates` words, or declares an entry point
# without new input, is INFORMATION: `agent.sh pipeline` and a note at freeze list it, nothing refuses.
# `code_patterns` is the same kind of expression over code (existing files of the plan scope, lines the diff adds):
# a hit is only listed as information, never required. Extend the lists for the project's own idioms.
validation:
  entry_words: "(GET|POST|PUT|PATCH|DELETE|HEAD) +/[^ ]*|endpoints?|webhooks?|(route|request|form|event|message|command) +handlers?|(queue|message|event|topic|job) +(consumers?|listeners?)|subscribes? +to|(grpc|rpc) +(methods?|services?|calls?)|graphql +(mutations?|quer(y|ies)|subscriptions?|resolvers?)|mutations?|cli +commands?|sub-?commands?|(new|adds?|added) +(cli +)?commands?|(cli|command-line|positional) +(arguments?|args?|flags?|options?)|argv|--[a-z][a-z0-9-]*|form +(fields?|submissions?)"
  entry_candidates: "endpoints?|routes?|handlers?|webhooks?|consumers?|subscribers?|forms?|cli +(arguments?|args?|flags?|options?|commands?)|command-line|argv|rpc|grpc|graphql|mutations?|(GET|POST|PUT|PATCH|DELETE|HEAD) +/[^ ]*|--[a-z][a-z0-9-]*|[A-Za-z0-9_-]*[.](graphqls?|gql|proto)"
  entry_input: "accepts?|accepting|takes?|taking|parameters?|params?|quer(y|ies)|bod(y|ies)|payloads?|arguments?|args?|flags?|options?|headers?|inputs?|required|optional|expects?"
  entry_new: "new|adds?|added|adding|introduc(es?|ed|ing)|creates?|created|registers?|registered|exposes?|exposed|fields?|gains?"
  entry_output: "responses?|returns?|returning|returned|omits?|omitted|output|status +codes?|shape|results?"
  entry_skip: "unchanged|documented|documents|no +change|not +changed|unmodified|as +before"
  code_patterns: "@(Get|Post|Put|Patch|Delete|Request)Mapping|@(app|router|bp|blueprint)\.(route|get|post|put|patch|delete)|(app|router|api|server)\.(get|post|put|patch|delete|all|use)\(|http\.HandleFunc|\.Handle\(|\.(GET|POST|PUT|PATCH|DELETE)\(|add_argument\(|argparse|\.command\(|yargs|cobra\.Command|flag\.(String|Int|Bool)|process\.argv|sys\.argv|webhook|subscribe\(|consumer|createServer"

# visual-proof, language pages (A172): on a page whose language is Turkish (a `design.languages` entry), words that look like Turkish typed
# without its letters ("Turkce", "degil", "icin") are reported as INFORMATION in the visual report, never as a blocking finding. `ascii_turkish_words`
# is the space-separated word list (lower case; extend it for the project); `ascii_turkish_allow` lists words used on purpose.
# Read with `agent.sh config-get visual.ascii_turkish_words`; empty words = the built-in list of visual-proof.
visual:
  ascii_turkish_words: "degil icin Turkce Turkiye cunku gore guvenli ozellik calisir ucretsiz giris cikis lutfen sifre guzel musteri iletisim urunler ogrenin baslayin"
  ascii_turkish_allow: ""

# Risk-adaptive pipeline (A78; `agent.sh pipeline <ID>` shows what fired and why). A signal comes from a changed
# or planned path (`paths`, globs as in risky_paths), from text the diff adds (`content`, an extended regular
# expression; empty = off; with `words` the line must match it and name one of the words, A162), or from a PLAN.md flag. `check` is the focus it adds inside an existing gate:
# contract, concurrency, performance, config (REVIEW_RULES, or REVIEW_SMALL on tier small), migration
# (REVIEW_DATA), visual (QA), dependencies, logging (SECURITY); a check runs only when its gate is required. `flag` is
# the PLAN.md flag that must declare a path signal (contract_change, concurrency, performance_critical in
# `## Risk`; data_change = a `## Data` section; ui = a `## UI` section); a diff signal without it is a blocking
# finding of its focus. `design_role` declares it before FREEZE. Plain documentation never carries a signal.
# The block is frozen with the plan (freeze.risk_sha256); the lead never edits it during a run.
# contract-proof (A83), frozen with the risk mapping: `paths` adds globs of files that are contracts whatever
# their content; `ignore` adds globs of changed JSON/YAML files that are not contracts (i18n, chart values,
# manifests). A file that parses as an OpenAPI, AsyncAPI or JSON Schema document is compared anyway.
# contract:
#   paths: "contracts/**/*.json"
#   ignore: "i18n/** charts/**/values*.yaml k8s/**"
# `unsupported` (A98): a check whose tool or capability is missing is UNSUPPORTED, never a PASS. `report` (default)
# records the focus `unsupported` (unproven), lets its gate close and makes the completion report list it under
# `## Unsupported Checks` with `not proven: <what>`; `block` keeps it a blocking finding only the user can waive
# (A78). An INCONCLUSIVE measurement (`performance INCONCLUSIVE: ...`, `visual INCONCLUSIVE: ...`) blocks in both.
risk:
  unsupported: report
  contract_file:
    paths: "**/openapi*.yaml **/openapi*.yml **/openapi*.json **/swagger*.yaml **/swagger*.yml **/swagger*.json **/asyncapi*.yaml **/asyncapi*.yml **/asyncapi*.json *.proto *.graphql *.graphqls *.gql *.avsc *.schema.json"
    # A contract under any other name: an OpenAPI/AsyncAPI/Swagger root key, a JSON Schema declaring a
    # json-schema.org `$schema`, a proto file header. Matched on the base or the whole current file, never on a
    # path in `contract.ignore` or on the built-in not-a-contract list (tsconfig, package.json, linter configs ...).
    content: ^(openapi|asyncapi|swagger):|"\$schema"[[:space:]]*:[[:space:]]*"https?://json-schema\.org/|^syntax = "proto
    flag: contract_change
    check: contract
    design_role: architect
  migration:
    paths: "**/migrations/** **/migration/** **/db/migrate/** **/alembic/versions/** *.sql"
    flag: data_change
    check: migration
    design_role: data_architect
  ui_path:
    paths: "*.html *.htm *.css *.scss *.sass *.less *.jsx *.tsx *.vue *.svelte"
    flag: ui
    check: visual
    design_role: designer
  dependency_manifest:
    # The manifests, locks and package-source settings of every ecosystem in .agents/ecosystems.json are added at read time
    # (A173; a run frozen before that keeps the paths it was frozen with). List here only what that file does not describe.
    paths: "mix.exs mix.lock conanfile.txt vcpkg.json deno.json deno.jsonc deno.lock"
    check: dependencies
  config_env:
    paths: ".env .env.* *.env **/config/*.yaml **/config/*.yml **/config/*.json **/config/*.toml **/config/*.ini *.ini *.properties appsettings*.json"
    check: config
  # Optional and language-specific, so off by default: set `content` to the project's own idioms.
  concurrency_hint:
    content:
    flag: concurrency
    check: concurrency
    design_role: architect
  performance_hint:
    content:
    flag: performance_critical
    check: performance
    design_role: architect
  # Sensitive data in logs (A162): a line the diff ADDS must match `content` (a log call: logger./log./console./
  # print/printf/Log.*, Console.WriteLine, fmt.Fprintf, var_dump and the like; `print "..."` and `puts "..."` without
  # parentheses too) and name one of `words` (space-separated, case-insensitive, whole identifier
  # parts: `password`, `user_password`, `userPassword`, `passwords`; not `discard` for `card`). The match only opens
  # a `logging` review in SECURITY (exploit-proof, sink `[log]`); it is no finding. Add your own words or log calls
  # here; `logger.info("started")` names no word and opens nothing. A call split over several lines is not seen.
  log_sensitive:
    content: (^|[^A-Za-z0-9])(log|Log|LOG|logger|Logger|LOGGER|logging|console|Console|Debug|Trace|slog|logrus|zap|Timber|NSLog|error_log|var_dump|dump|[Pp]rint|[Pp]rintf|[Pp]rintln|puts|[Ff][Pp][Rr][Ii][Nn][Tt]([Ff]|[Ll][Nn])?|eprintln)(\.|\(|->|::)|(^|[^A-Za-z0-9])(info|warn|debug|error|trace|println|print|eprintln|eprint|dbg)!|(^|[^A-Za-z0-9_.])(print|puts|Print)[[:space:]]+[^[:space:]=]
    words: password passwd token secret authorization cookie email phone card iban ssn tckn
    check: logging
  # Plan flags: a flag set in PLAN.md adds its check even without a matching path.
  contract_change:
    check: contract
  concurrency:
    check: concurrency
  performance_critical:
    check: performance
  destructive:
    check: migration
  ui:
    check: visual

# --- Inherited from the source workflow --------------------------------------------------
default_mode: deterministic
# The active-run selector (local state, git-ignored). Absent or empty: no active task.
active_run_file: .agents/local/ACTIVE_RUN
policy_source: .agents/modes
# Knowledge transaction (Transaction B) scope: space-separated; an entry ending in / is a directory
# prefix, any other entry an exact path. docs/product/ is the default of product.dir. A path listed in the frozen plan scope stays application scope.
knowledge_scope_root: docs/design/ docs/adr/ docs/wiki/ docs/product/
safety:
  destructive_git_requires_explicit_authorization: true
  external_network_requires_task_authorization: true
  dependency_changes_require_task_authorization: true
# The class selects artifacts and the QA gate. review: yes|no|optional sets a review floor (tier at least
# small); CRITICAL is always tier full. max_scope_paths bounds PLAN.md scope paths (default 15): over it, freeze stops and
# proposes a split; only the user's answer 'proceed without splitting' lets it continue (recorded, A171). TRIVIAL refuses outright.
# dispatch_timeout_seconds (A171) overrides dispatch.timeout_seconds for a dispatched step of that class.
pipelines:
  TRIVIAL:
    evidence: no
    qa: no
    review: no
    architect: no
    max_explorers: 0
    max_scope_paths: 2
    dispatch_timeout_seconds: 900
  STANDARD:
    evidence: yes
    qa: yes
    review: optional
    architect: no
    max_explorers: 1
    max_scope_paths: 15
    dispatch_timeout_seconds: 1800
  COMPLEX:
    evidence: yes
    qa: yes
    review: yes
    architect: yes
    max_explorers: 2
    max_scope_paths: 15
    dispatch_timeout_seconds: 3600
  CRITICAL:
    evidence: yes
    qa: yes
    review: yes
    architect: yes
    max_explorers: 3
    max_scope_paths: 12
    dispatch_timeout_seconds: 3600
# Execution policy (D5, D7): read by exec-policy.sh, dispatch.sh and runtime-detect.sh.
execution_policy:
  # Policy semantics version; bump when resolution or escalation behaviour changes.
  revision: 1
  # Efforts no override may select.
  forbidden_efforts: ultra
  # Hard ceiling for the dynamic context budget in bytes, overrides included.
  max_context_bytes: 262144
  # Base (full-strength) model a LEAD must run on, per runtime (A135). A lead launched or resumed on a cheaper ladder
  # model is refused (exec-policy.sh check-lead; e2e harness; doctor). Workers are not bound by it.
  lead_base_model:
    codex: gpt-6-sol
  # Per class: effort floor and dynamic context budget in bytes (the role's stable prefix is outside it).
  classes:
    TRIVIAL: effort=low context_bytes=16384
    STANDARD: effort=low context_bytes=49152
    COMPLEX: effort=medium context_bytes=98304
    CRITICAL: effort=high context_bytes=163840
  # Per runtime: model ladder (cheapest to strongest) and supported efforts (lowest to highest).
  providers:
    claude:
      models: haiku sonnet opus
      efforts: low medium high xhigh max
    codex:
      models: gpt-6-luna gpt-6-sol gpt-6-astra
      efforts: none low medium high xhigh
# Capability tier (1..3) of every runtime model; role tier floors are checked against it (D5, D7).
# A ladder model without an entry gets its ladder position as tier.
capabilities:
  claude:
    haiku: 1
    sonnet: 2
    opus: 3
  codex:
    gpt-6-luna: 1
    gpt-6-sol: 2
    gpt-6-astra: 3
# Night mode (A157): `proofline batch`, run in the lead's own session since 0.0.32. mutation_budget_cap is the highest mutation budget the
# batch approval may raise to (a task that needs more is parked with a question); ci_wait_minutes is how long the lead waits for a running CI
# run of a merge commit before it stops the batch; ci_appear_minutes is how long it waits for that run to appear. runtimes and task_timeout
# belonged to the removed headless driver: old configs may keep them, they are accepted, not validated, and ignored.
batch:
  mutation_budget_cap: 40
  ci_wait_minutes: 30
  ci_appear_minutes: 10
dispatch:
  # Timeout of one specialist run in seconds (minimum 30).
  timeout_seconds: 1800
  # Permission mode of a headless Claude worker started by dispatch.sh (A114): bypassPermissions | acceptEdits | default.
  # A headless worker cannot be prompted, so a narrower mode usually leaves it unable to submit; the PreToolUse hook
  # confines it either way. bypassPermissions is refused while that hook is not wired in .claude/settings.json.
  claude_permission_mode: bypassPermissions
  # D8 Worker tier: any headless CLI as a runtime, one line per runtime, e.g.
  #   mycli: mycli run --model {model} --input {prompt_file} --out {output_file} --cwd {root}
  # Placeholders: {prompt_file} {model} {effort} {output_file} {root} (substituted shell-quoted).
  # A runtime used this way also needs execution_policy.providers.<runtime> and capabilities.<runtime>.
  # A template set for claude or codex replaces the built-in invocation.
  command_template:
